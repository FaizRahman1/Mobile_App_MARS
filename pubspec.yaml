name: bridgeinsp_new
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_form_bloc:
    path: local_packages/flutter_form_bloc-0.31.0

  bloc: ^8.1.1
  equatable: ^2.0.3
  meta: ^1.1.6

  http: ^0.13.5
  dio: ^5.9.0
  connectivity_plus: ^6.1.5

  shared_preferences: ^2.2.0
  sqflite: ^2.2.8+4
  excel: ^4.0.6
  open_file: ^3.3.2

  image_picker: ^1.2.0
  image_painter: ^0.7.1
  gallery_saver_plus: ^3.2.9

  flutter_keyboard_visibility: ^6.0.0
  awesome_notifications: ^0.10.1

  # Exact version prevents upgrade to 14.0.3,
  # which requires Dart SDK 3.10 through package_info_plus.
  geolocator: 14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.13.1
  very_good_analysis: ^9.0.0
  flutter_lints: ^5.0.0

dependency_overrides:
  flutter_keyboard_visibility: ^6.0.0
  http: ^1.5.0
  intl: ^0.20.0

  # Required because form_bloc 0.31.0 requests uuid 3.x,
  # while geolocator_android requests uuid 4.x.
  uuid: ^4.5.2

flutter:
  uses-material-design: true

  assets:
    - images/PLUS.png
    - assets/icon/MARSS.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/MARSS.png"
  adaptive_icon_background: "#0D1B2A"
  adaptive_icon_foreground: "assets/icon/MARSS.png"
  min_sdk_android: 21